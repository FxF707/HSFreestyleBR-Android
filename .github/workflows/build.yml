
name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP do projeto nao encontrado"
            exit 1
          fi
          mkdir -p source
          unzip -o "$ZIP_FILE" -d source
          GRADLEW=$(find source -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "Arquivo gradlew nao encontrado no ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: cd "$PROJECT_DIR" && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HSFreestyleBR-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
